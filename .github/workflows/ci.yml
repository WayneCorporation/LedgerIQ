name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://ledgeriq:test-password@localhost:5432/ledgeriq_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ledgeriq_test
          POSTGRES_USER: ledgeriq
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgeriq -d ledgeriq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker build --tag ledgeriq:${{ github.sha }} .
